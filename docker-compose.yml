# Self-hosted HarnessRouter — headless (this fork carries no UI).
#
#   1. cp .env.example .env      and put YOUR provider key in it
#   2. docker compose up -d
#   3. curl http://localhost:8080/healthz
#
# One container, one volume. No external services. Driven by its API — see README.md.
services:
  harnessrouter:
    image: harnessrouter/harnessrouter:latest
    # Use this instead of `image:` to build locally:
    # build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    volumes:
      # Everything durable lives here: SQLite databases, blobs, and the secret store.
      - harnessrouter-data:/data
    restart: unless-stopped

volumes:
  harnessrouter-data:
